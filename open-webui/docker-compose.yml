# Open WebUI 一键启动配置
# 用法：
# 1. 在电脑上安装 Docker Desktop（https://www.docker.com/products/docker-desktop/）
# 2. 把 docker-compose.yml 下载到电脑上任意文件夹
# 3. 在该文件夹打开终端/命令行，运行：docker compose up -d
# 4. 浏览器打开 http://localhost:3000，注册管理员账号即可使用
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
